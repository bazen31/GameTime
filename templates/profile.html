{% extends "base.html" %}
{% block title %}Профиль — GameTime{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">АККАУНТ</p><h1>Профиль</h1></div></section>
<section class="card profile-card">
  <dl class="profile-list">
    <div><dt>Имя</dt><dd>{{ current_user.name }}</dd></div>
    <div><dt>Email</dt><dd>{{ current_user.email }}</dd></div>
    <div><dt>Роль</dt><dd>{{ 'Администратор' if current_user.role == 'admin' else 'Клиент' }}</dd></div>
  </dl>
  <a class="button secondary" href="{{ url_for('my_bookings') }}">Перейти к моим броням</a>
</section>
{% endblock %}
